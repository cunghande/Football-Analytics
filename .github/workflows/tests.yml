name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC — full-pipeline smoke test only (see smoke-test job).
    - cron: "0 6 * * 1"

jobs:
  # Fast tests include mocked detector/tracker paths but do not run inference
  # on a full video. Sensitive changes additionally need a real pipeline run.
  changes:
    name: Detect sensitive changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.check.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for detection/tracking-sensitive changes
        id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          # Keep this regex in sync with the identical one in
          # .github/workflows/video-review-gate.yml's `changes` job — the two
          # gates (smoke-test trigger, merge-block) will silently desync if
          # only one is updated.
          if echo "$CHANGED" | grep -Eq '^(requirements\.txt|config\.py|src/(yolo_detector|tracker|camera_motion)\.py)$'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

  fast-tests:
    name: Fast tests (pytest -m "not slow")
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # The suite also imports the detector, tracker, dashboard and PDF modules.
      # Install the project's dependencies so collection works on a clean runner.
      - name: Install fast-test dependencies
        run: pip install -r requirements.txt pypdf

      # Initial-render tests only check that the configured path exists; they
      # never load weights or perform inference. The real checkpoint is private.
      - name: Create dashboard render-test placeholder
        run: |
          mkdir -p runs/modal/detection_player_role_ft_full_v1/weights
          touch runs/modal/detection_player_role_ft_full_v1/weights/best.pt

      - name: Run fast tests
        run: pytest -m "not slow"

  smoke-test:
    name: Full pipeline smoke test (pytest -m slow)
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.sensitive == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full-pipeline smoke test
        env:
          YOLO_DEVICE: cpu
          # The fine-tuned dashboard checkpoint is private and not in Git.
          # Use the public baseline so CI can run without the Modal volume.
          YOLO_MODEL_PATH: yolo26x.pt
        run: pytest -m slow

      - name: Upload smoke-test output artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: |
            output/analysis.mp4
            output/analysis_summary.json
          retention-days: 14
          if-no-files-found: warn
